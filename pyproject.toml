[project]
name = "keel"
version = "0.1.0"
description = "An agent harness that makes small local models dependable at tool use, with an eval runner that says when a change really helped."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["agent", "llm", "local models", "tool use", "evaluation", "mlx", "apple silicon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    { name = "rohan2010", email = "29030683+rohan2010@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "mlx>=0.32.4",
    "mpmath==1.3.0",  # bfcl-eval backends (bfcl-eval itself is installed --no-deps)
    "mlx-lm>=0.32.2",
    "numpy>=2.5.4",
    "agent-client-protocol==1.0.0",
    "tokenizers>=0.23.3",  # token counts without MLX (server backends, P4); already pulled in by mlx-lm
    "pyyaml>=6.0",  # pre-registration files (Ch4 P6); already pulled in by huggingface-hub
]

[project.scripts]
keel-core = "keel.cli:main"
keel = "keel._keel_bin:main"        # starts the Rust CLI/TUI bundled in the wheel (keel/bin/keel)

[build-system]
# hatchling + hatch_build.py: the wheel carries the Rust `keel` binary, so it is tagged macOS arm64 (Ch7 P4, D1)
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keel"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/keel", "crates", "Cargo.toml", "Cargo.lock", "hatch_build.py", "LICENSE", "THIRD_PARTY_NOTICES.md",
           "README.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[tool.pytest.ini_options]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["evidence/ch6-headline/code"]

[tool.ruff.lint]
# Short rule set (Ch7 P2, release audit #27): real bugs (pyflakes, bugbear), basic style errors, import order.
select = ["E", "F", "W", "I", "B"]
# Style the code deliberately doesn't follow: long lines are allowed (formatting is not enforced), `l` loop names,
# small named lambdas, `a; b` on one line in tests.
ignore = ["E501", "E741", "E731", "E702"]

[tool.ruff.lint.per-file-ignores]
# Hash-frozen by plans/tasks-freeze-v2.sha256 (the Ch6 headline's tasks): never edited, so style-only findings are off;
# other pyflakes / bugbear findings are still reported.
"src/keel/evals/tasks.py" = ["I001", "E", "W", "B007", "B905", "F541"]
"src/keel/evals/tasks_ch6.py" = ["I001", "E", "W", "B007", "B905", "F541"]
"tests/test_ch6_tasks.py" = ["I001", "E", "W", "B007", "B905", "F541"]
