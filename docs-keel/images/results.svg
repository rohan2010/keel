<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img" aria-labelledby="t d">
  <title id="t">Tasks done correctly, out of 96 tries</title>
  <desc id="d">Same small AI model (Qwen3.5-4B) on 24 everyday file tasks, 4 tries each. keel: 65 of 96 (68%). keel basic: 61 (64%). goose: 54 (56%). opencode: 53 (55%). The AI on its own: 51 (53%).</desc>
  <style>
    .ink { fill: #0b0b0b; } .sub { fill: #52514e; } .mute { fill: #898781; }
    .grid { stroke: #e1e0d9; stroke-width: 1; } .base { stroke: #c3c2b7; stroke-width: 1; }
    .keel { fill: #2a78d6; } .other { fill: #898781; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f0efec; } .sub { fill: #c3c2b7; }
      .grid { stroke: #2c2c2a; } .base { stroke: #383835; } .keel { fill: #3987e5; }
    }
  </style>
  <text class="ink" x="0" y="22" font-size="17" font-weight="600">Tasks done correctly, out of 96 tries</text>
  <text class="sub" x="0" y="44" font-size="13">Same small AI model, same 24 everyday file tasks, 4 tries each</text>

  <!-- grid: 0..100% maps to x 190..520 (3.3 px per point) -->
  <g>
    <line class="grid" x1="272.5" y1="62" x2="272.5" y2="266"/>
    <line class="grid" x1="355" y1="62" x2="355" y2="266"/>
    <line class="grid" x1="437.5" y1="62" x2="437.5" y2="266"/>
    <line class="grid" x1="520" y1="62" x2="520" y2="266"/>
    <line class="base" x1="190" y1="62" x2="190" y2="266"/>
    <text class="mute" x="190" y="284" font-size="12" text-anchor="middle">0%</text>
    <text class="mute" x="272.5" y="284" font-size="12" text-anchor="middle">25%</text>
    <text class="mute" x="355" y="284" font-size="12" text-anchor="middle">50%</text>
    <text class="mute" x="437.5" y="284" font-size="12" text-anchor="middle">75%</text>
    <text class="mute" x="520" y="284" font-size="12" text-anchor="middle">100%</text>
  </g>

  <!-- bars: 24 px tall, 16 px apart; value = share of 96 -->
  <g font-size="14">
    <text class="ink" x="180" y="88" text-anchor="end" font-weight="600">keel</text>
    <path class="keel" d="M190 72 h219.4 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-219.4 z"/>
    <text class="ink" x="421" y="89" font-weight="600">68%</text>

    <text class="ink" x="180" y="128" text-anchor="end">keel, basic</text>
    <path class="keel" opacity="0.55" d="M190 112 h205.6 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-205.6 z"/>
    <text class="ink" x="407" y="129">64%</text>

    <text class="ink" x="180" y="168" text-anchor="end">goose</text>
    <path class="other" d="M190 152 h181.6 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-181.6 z"/>
    <text class="ink" x="383" y="169">56%</text>

    <text class="ink" x="180" y="208" text-anchor="end">opencode</text>
    <path class="other" d="M190 192 h178.1 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-178.1 z"/>
    <text class="ink" x="380" y="209">55%</text>

    <text class="ink" x="180" y="248" text-anchor="end">the AI on its own</text>
    <path class="other" d="M190 232 h171.3 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-171.3 z"/>
    <text class="ink" x="373" y="249">53%</text>
  </g>

  <text class="sub" x="0" y="310" font-size="12">keel vs the AI on its own: +15 points, tested with a method fixed before the run.</text>
  <text class="sub" x="0" y="326" font-size="12">goose and opencode are other agent tools on the same model, shown for context.</text>
</svg>
